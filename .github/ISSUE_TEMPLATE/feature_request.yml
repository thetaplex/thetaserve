name: Feature request
description: Suggest a change or a new device, model or provider.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. For a new profile, include measured results if you have them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
