name: Feature request
description: Suggest a change, a new model or a new provider.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. For a new model or new family flags, include the results of a real run if you have them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
