# vLLM image for every launch, and the vLLM flags of each model family that no metadata gives.
# Keys are the short names `up --model` takes. Flags marked VERIFY are not yet run on hardware.
schema_version: 2
vllm_image: vllm/vllm-openai:v0.32.0   # M1 pilot, 2026-10-22

qwen3.8-27b:
  hf_family: Qwen/Qwen3.8-27B
  common_args: [--enable-prefix-caching, --reasoning-parser, qwen3,
                --enable-auto-tool-choice, --tool-call-parser, qwen3_xml,
                # vLLM's default of 256 exceeds the Mamba cache blocks: 187 on an A40 at 128K.
                --max-num-seqs, '32']   # M1 pilot, 2026-10-22: A40, FP8 weights

gemma4-31b:
  hf_family: google/gemma-4-31B-it   # instruction-tuned; quantisations are made from this
  common_args: [--enable-prefix-caching, --reasoning-parser, gemma4,
                --enable-auto-tool-choice, --tool-call-parser, gemma4]   # VERIFY
